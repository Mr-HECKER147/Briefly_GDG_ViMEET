<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Summary | Briefly</title>

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <script src="{{ url_for('static', filename='summary-actions.js') }}" defer></script>
</head>
<body>

    <header>
    <div class="navbar">
        <a class="logo" href="/">Briefly</a>

        <div class="nav-links">
            <a class="history-link" href="/history">
                History
            </a>

            <span class="username">
                {{ session.get("username") }}
            </span>

            <form method="post" action="{{ url_for('logout') }}" class="nav-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button class="history-link nav-button" type="submit">Log out</button>
            </form>
        </div>
    </div>
</header>

    <main>
        <a class="back-link" href="{{ url_for('history') }}">
            ← Back to history
        </a>

        <section class="detail-heading">
            <p class="eyebrow">SAVED SUMMARY</p>
            <h1>{{ summary['source_name'] }}</h1>

            <p class="detail-meta">
                {{ summary['summary_length']|capitalize }} summary ·
                {{ summary['created_at'] }}
            </p>
        </section>

        <section class="result">
            <p class="result-label">SUMMARY</p>
            <div class="summary-text" data-summary-content>
                {{ summary['summary_text'] }}
            </div>
            <div class="summary-actions">
                <button type="button" class="secondary-button" data-copy-summary>Copy summary</button>
                <a class="secondary-button" href="{{ url_for('download_summary_pdf', summary_id=summary['id']) }}">Download PDF</a>
                <span class="copy-status" data-copy-status aria-live="polite"></span>
            </div>
        </section>

        <section class="original-text">
            <p class="result-label">ORIGINAL TEXT</p>
            <div class="summary-text">
                {{ summary['original_text'] }}
            </div>
        </section>

        <form class="detail-delete-form" method="post" action="{{ url_for('remove_summary', summary_id=summary['id']) }}" onsubmit="return confirm('Delete this saved summary? This cannot be undone.');">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="delete-button" type="submit">Delete summary</button>
        </form>
    </main>

</body>
</html>
